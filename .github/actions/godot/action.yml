name: Set up Godot
description: Puts Godot (headless-capable editor build) on the PATH as `godot`, with its export templates when asked.
inputs:
  version:
    description: Godot version, e.g. 4.7.2
    required: true
  templates:
    description: Also install the export templates
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/godot-dist
        key: godot-${{ inputs.version }}-${{ inputs.templates }}
    - name: Download
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}-stable"
        mkdir -p ~/godot-dist
        curl -fsSL -o /tmp/godot.zip "$base/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q -o /tmp/godot.zip -d ~/godot-dist
        if [ "${{ inputs.templates }}" = "true" ]; then
          curl -fsSL -o ~/godot-dist/templates.tpz "$base/Godot_v${{ inputs.version }}-stable_export_templates.tpz"
        fi
    - name: Install
      shell: bash
      run: |
        set -euo pipefail
        sudo install -m 755 ~/godot-dist/Godot_v${{ inputs.version }}-stable_linux.x86_64 /usr/local/bin/godot
        if [ "${{ inputs.templates }}" = "true" ]; then
          dir=~/.local/share/godot/export_templates/${{ inputs.version }}.stable
          mkdir -p "$dir"
          unzip -q -o ~/godot-dist/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$dir/"
        fi
        godot --version
