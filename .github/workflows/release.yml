name: Release

# A tag v<version> (matching application/config/version in project.godot)
# runs the tests, exports Linux and Windows builds, and publishes them as a
# GitHub release with the changelog's section for that version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the project's version
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^config\/version="(.*)"$/\1/p' project.godot)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"
      - name: Import assets
        run: ci/import.sh
      - name: Export
        run: |
          set -euo pipefail
          mkdir -p builds/linux builds/windows
          godot --headless --path . --export-release Linux builds/linux/tiny-truck-wars.x86_64
          godot --headless --path . --export-release Windows builds/windows/tiny-truck-wars.exe
          test -s builds/linux/tiny-truck-wars.x86_64
          test -s builds/windows/tiny-truck-wars.exe
      - name: Smoke test the Linux build
        run: timeout 120 ./builds/linux/tiny-truck-wars.x86_64 --headless --audio-driver Dummy --quit-after 600
      - name: Package
        run: |
          set -euo pipefail
          for platform in linux windows; do
            dir="dist/tiny-truck-wars-$VERSION-$platform"
            mkdir -p "$dir"
            cp builds/$platform/* "$dir/"
            cp README.md CREDITS.md CHANGELOG.md LICENSE "$dir/"
            cp -r licenses "$dir/licenses"
            rm -f "$dir/licenses/.gdignore"
            (cd dist && zip -qr "tiny-truck-wars-$VERSION-$platform.zip" "tiny-truck-wars-$VERSION-$platform")
          done
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Tiny Truck Wars $VERSION" \
            --notes-file dist/notes.md \
            dist/tiny-truck-wars-$VERSION-linux.zip \
            dist/tiny-truck-wars-$VERSION-windows.zip
