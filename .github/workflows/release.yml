name: Release

# A tag v<version> (matching application/config/version in project.godot)
# runs the tests, exports Linux, Windows and Web builds, and publishes them as a
# GitHub release with the changelog's section for that version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-24.04
    env:
      # Whether to push to itch.io too (a step's if cannot read secrets).
      HAS_BUTLER: ${{ secrets.BUTLER_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the project's version
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^config\/version="(.*)"$/\1/p' project.godot)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"
      - name: Import assets
        run: ci/import.sh
      - name: Export and pack
        run: ci/package.sh
      - name: Smoke test the Linux build
        run: |
          timeout 60 ./builds/linux/tiny-truck-wars.x86_64 --headless --audio-driver Dummy --quit-after 120
          timeout 120 ./builds/linux/tiny-truck-wars.x86_64 --headless --audio-driver Dummy --quit-after 600 -- --map=river
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Tiny Truck Wars $VERSION" \
            --notes-file dist/notes.md \
            dist/tiny-truck-wars-$VERSION-linux.zip \
            dist/tiny-truck-wars-$VERSION-windows.zip \
            dist/tiny-truck-wars-$VERSION-web.zip
      - name: Push to itch.io (when BUTLER_API_KEY is set)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        if: ${{ env.HAS_BUTLER == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q -o /tmp/butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          export PATH="$HOME/butler:$PATH"
          ITCH_TARGET=${ITCH_TARGET:-ssube/tiny-truck-wars} ci/itch-push.sh
